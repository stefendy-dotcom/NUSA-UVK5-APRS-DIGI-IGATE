name: One-time stefendy-nusa bot main attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-nusa-bot-main-commit.yml'

permissions:
  contents: read

jobs:
  document-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Create NUSA GitHub App token
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NUSA_APP_CLIENT_ID }}
          private-key: ${{ secrets.NUSA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository main with bot token
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
          ref: main
          fetch-depth: 1

      - name: Commit identity document as real bot and remove this workflow
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          BOT_LOGIN="${BOT_SLUG}[bot]"
          [[ "$BOT_LOGIN" == 'stefendy-nusa[bot]' ]] || { echo 'Unexpected App identity'; exit 1; }
          BOT_ID="$(gh api "/users/${BOT_LOGIN}" --jq '.id')"
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
          cat > .github/NUSA_BOT_IDENTITY.md <<'DOC'
          # NUSA GitHub Automation Bot
          
          The official GitHub App bot identity for future automated operations
          in this repository is **`stefendy-nusa[bot]`**.
          
          Authenticated workflow writes use the GitHub App installation token
          obtained from GitHub Actions variable `NUSA_APP_CLIENT_ID` and secret
          `NUSA_APP_PRIVATE_KEY`. Merely changing `git config user.name` does
          not replace GitHub App authentication.
          
          Existing historical commits and firmware releases are preserved.
          DOC
          git add .github/NUSA_BOT_IDENTITY.md
          git rm .github/workflows/one-time-nusa-bot-main-commit.yml
          git commit -m 'docs: establish stefendy-nusa GitHub App identity'
          SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          AUTHOR="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.author.login')"
          COMMITTER="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.committer.login')"
          echo "MAIN_COMMIT_SHA=${SHA}"
          echo "GITHUB_AUTHOR=${AUTHOR}"
          echo "GITHUB_COMMITTER=${COMMITTER}"
          [[ "$AUTHOR" == "$BOT_LOGIN" && "$COMMITTER" == "$BOT_LOGIN" ]] || { echo 'Incorrect GitHub commit actor'; exit 1; }
          echo 'SUCCESS: Real GitHub App bot authored commit on main. Temporary workflow cleaned.'
