name: Publish ESP32-C3 iGate REV1A

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-igate-esp32c3-rev1a.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified ESP32-C3 package
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://map.aprsid.com/static/nusa-uvk5-igate-rev1a"
          mkdir -p "UV-K5 IGATE/esp32"
          curl -fL "$BASE/NUSA_UVK5_ESP32C3_IGATE_REV1A_BIN.zip"             -o "UV-K5 IGATE/esp32/NUSA_UVK5_ESP32C3_IGATE_REV1A_BIN.zip"
          echo "c88e93f0744ef3786f3312b0aa5287b150a2920222ee76bcfdf9fa33fc13721e  UV-K5 IGATE/esp32/NUSA_UVK5_ESP32C3_IGATE_REV1A_BIN.zip" | sha256sum -c -

      - name: Update SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd "UV-K5 IGATE"
          grep -v "NUSA_UVK5_ESP32C3_IGATE_REV1A_BIN.zip" SHA256SUMS.txt > SHA256SUMS.tmp || true
          mv SHA256SUMS.tmp SHA256SUMS.txt
          echo "c88e93f0744ef3786f3312b0aa5287b150a2920222ee76bcfdf9fa33fc13721e  esp32/NUSA_UVK5_ESP32C3_IGATE_REV1A_BIN.zip" >> SHA256SUMS.txt

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "UV-K5 IGATE/esp32/NUSA_UVK5_ESP32C3_IGATE_REV1A_BIN.zip" "UV-K5 IGATE/SHA256SUMS.txt"
          if ! git diff --cached --quiet; then
            git commit -m "Add ESP32-C3 iGate REV1A binary package"
            git push
          fi

      - name: Add package to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload igate-rev1a             "UV-K5 IGATE/esp32/NUSA_UVK5_ESP32C3_IGATE_REV1A_BIN.zip"             --clobber
