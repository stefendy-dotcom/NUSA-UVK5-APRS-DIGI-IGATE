name: Clean UV-K5 release assets

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-persistence-fix1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Remove developer-only assets from public releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          gh release delete-asset rev1g-fix1 SHA256SUMS_PERSIST_FIX1.txt --repo "$REPO" --yes 2>/dev/null || true
          gh release delete-asset rev1g-fix1 DIGI_REV1G_SETTINGS_PERSIST_FIX1.patch --repo "$REPO" --yes 2>/dev/null || true

          gh release delete-asset rev1h-standalone-fix1 SHA256SUMS_PERSIST_FIX1.txt --repo "$REPO" --yes 2>/dev/null || true
          gh release delete-asset rev1h-standalone-fix1 DIGI_REV1H_STANDALONE_SETTINGS_PERSIST_FIX1.patch --repo "$REPO" --yes 2>/dev/null || true

          gh release delete-asset igate-rev1a-fix1 SHA256SUMS_PERSIST_FIX1.txt --repo "$REPO" --yes 2>/dev/null || true
          gh release delete-asset igate-rev1a-fix1 IGATE_REV1A_SETTINGS_PERSIST_FIX1.patch --repo "$REPO" --yes 2>/dev/null || true

          gh release delete-asset igate-rev1b-standalone-fix1 SHA256SUMS_PERSIST_FIX1.txt --repo "$REPO" --yes 2>/dev/null || true
          gh release delete-asset igate-rev1b-standalone-fix1 IGATE_REV1B_STANDALONE_SETTINGS_PERSIST_FIX1.patch --repo "$REPO" --yes 2>/dev/null || true

      - name: Confirm releases contain firmware assets only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          for tag in rev1g-fix1 rev1h-standalone-fix1 igate-rev1a-fix1 igate-rev1b-standalone-fix1; do
            echo "== $tag =="
            gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name'
          done
