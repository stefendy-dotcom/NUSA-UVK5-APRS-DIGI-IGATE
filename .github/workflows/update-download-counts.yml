name: Update cumulative download counters

on:
  release:
    types: [published, released, edited, deleted, unpublished]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cumulative-download-counter
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate as stefendy-nusa[bot]
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NUSA_APP_CLIENT_ID }}
          private-key: ${{ secrets.NUSA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}

      - name: Configure verified stefendy-nusa[bot] commit identity
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          BOT_LOGIN="${BOT_SLUG}[bot]"
          [[ "$BOT_LOGIN" == "stefendy-nusa[bot]" ]] || { echo "Unexpected bot: $BOT_LOGIN"; exit 1; }
          BOT_ID="$(gh api "/users/${BOT_LOGIN}" --jq '.id')"
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"

      - name: Calculate cumulative Release Asset downloads
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
        run: python3 .github/scripts/update_download_counts.py

      - name: Commit changed counters
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- badges/; then
            echo "Download counters are unchanged."
            exit 0
          fi


          git add badges/
          git commit -m "chore: update cumulative download counters"
          git push
