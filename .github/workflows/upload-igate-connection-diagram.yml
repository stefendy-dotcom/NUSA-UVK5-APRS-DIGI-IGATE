name: Upload iGate Connection Diagram

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upload-igate-connection-diagram.yml"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download connection diagram
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://map.aprsid.com/static/nusa-uvk5-igate-rev1a/Connection_Diagram.webp"             -o "UV-K5 IGATE/Connection Diagram.webp"
          echo "3e4d9edfd7e7b8cb2eb01796b7a47cdb4e8c4a415606995f72c293a3c1ce7766  UV-K5 IGATE/Connection Diagram.webp" | sha256sum -c -

      - name: Commit diagram
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "UV-K5 IGATE/Connection Diagram.webp"
          if ! git diff --cached --quiet; then
            git commit -m "Add UV-K5 iGate connection diagram"
            git push
          fi
